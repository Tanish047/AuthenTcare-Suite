<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuthenTcare Suite</title>
    <!-- CSP is set dynamically by main process based on environment -->

    <!-- ✅ Google Fonts CDN -->
    <!-- Removed external Google Fonts link for CSP compliance. Font will be self-hosted. -->

    <style>
      body, #root {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-width: 100vw;
        /* Prevent layout shifts during loading */
        overflow-x: hidden;
        /* Stable layout foundation */
        position: relative;
      }
      
      /* Prevent layout shifts with stable dimensions */
      * {
        box-sizing: border-box;
      }
      
      /* Loading state to prevent CLS */
      #root:empty::before {
        content: '';
        display: block;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }
      
      /* Prevent font loading shifts */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
